<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04070c" />
    <title>Farts Around the World</title>
    <meta name="description" content="A map of real fart recordings from real places. Tap a dot to listen, or record your own and pin it to the globe." />
    <meta property="og:title" content="Farts Around the World" />
    <meta property="og:description" content="Real farts, pinned where they happened. Tap a dot to listen — or add your own." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A8%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
    <script>
      ;(function () {
        var path = window.location.pathname
        var home = path === '/' || path.indexOf('/r/') === 0
        document.documentElement.dataset.routeMode = home ? 'home' : 'subpage'
      })()
    </script>
    <style>
      /* Critical splash CSS — shows instantly, before any JS loads */
      html, body { margin: 0; padding: 0; background: #04070c; overflow: hidden; }
      html[data-route-mode="subpage"],
      html[data-route-mode="subpage"] body { overflow: auto; }
      html[data-route-mode="subpage"] #boot { display: none; }

      #boot {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse 70% 55% at 50% 45%, rgba(24, 58, 92, 0.45), transparent 70%),
          #04070c;
        font-family: 'Chakra Petch', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #eef6ff;
        transition: opacity 0.6s ease, visibility 0.6s ease;
        cursor: pointer;
      }
      #boot.is-leaving { opacity: 0; visibility: hidden; }
      .boot__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        animation: bootRise 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #boot.is-leaving .boot__inner {
        transform: scale(1.04);
        transition: transform 0.6s ease;
      }
      .boot__mark {
        font-size: 56px;
        line-height: 1;
        filter: drop-shadow(0 0 18px rgba(157, 255, 74, 0.45));
        animation: bootPuff 2.4s ease-in-out infinite;
      }
      .boot__presents {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: rgba(212, 168, 67, 0.85);
      }
      .boot__title {
        font-size: clamp(28px, 7vw, 54px);
        font-weight: 700;
        letter-spacing: 0.08em;
        line-height: 1.05;
        text-transform: uppercase;
        text-shadow: 0 0 34px rgba(56, 243, 255, 0.45);
      }
      .boot__tagline {
        font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 15px;
        color: rgba(186, 208, 228, 0.8);
      }
      .boot__bar {
        width: 140px;
        height: 3px;
        margin-top: 10px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .boot__bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(90deg, #9dff4a, #38f3ff);
        animation: bootBar 1.1s ease-in-out infinite;
      }
      @keyframes bootRise {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: none; }
      }
      @keyframes bootPuff {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-4px) scale(1.06); }
      }
      @keyframes bootBar {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot__inner, .boot__mark, .boot__bar span { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="presentation">
      <div class="boot__inner">
        <div class="boot__mark">💨</div>
        <div class="boot__presents">Potato Propoganda presents</div>
        <div class="boot__title">Farts Around the World</div>
        <div class="boot__tagline">Real farts, pinned where they happened.</div>
        <div class="boot__bar"><span></span></div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Hide the splash as soon as the app says the globe is ready.
      ;(function () {
        var boot = document.getElementById('boot')
        if (!boot) return
        if (document.documentElement.dataset.routeMode === 'subpage') {
          boot.parentNode.removeChild(boot)
          return
        }
        var started = Date.now()
        var seen = false
        try {
          seen = localStorage.getItem('fatw:seen') === '1'
          localStorage.setItem('fatw:seen', '1')
        } catch (e) {}
        var minimum = seen ? 250 : 1400
        var hidden = false
        function hide() {
          if (hidden) return
          hidden = true
          setTimeout(function () {
            boot.classList.add('is-leaving')
            setTimeout(function () {
              if (boot.parentNode) boot.parentNode.removeChild(boot)
            }, 700)
          }, Math.max(0, minimum - (Date.now() - started)))
        }
        window.addEventListener('fatw:ready', hide)
        boot.addEventListener('click', function () { minimum = 0; hide() })
        setTimeout(hide, 8000)
      })()
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
